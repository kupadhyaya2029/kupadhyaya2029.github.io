<style>
:root{

.mono{font-family:var(--mono)}
.hand{font-family:var(--hand)}
.wrap{width:min(1180px,100% - 2*clamp(16px,4vw,40px));margin-inline:auto}

#sky{position:fixed;inset:0;z-index:-3;background:linear-gradient(180deg,var(--top) 0%,var(--mid) 58%,var(--hor) 100%)}

@keyframes drift{to{transform:translateX(160vw)}}

.memo .hd{font-family:var(--mono);font-size:14px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.memo .hd div{display:flex;gap:10px;min-height:1.5em}.memo .hd b{min-width:5.2em}
.memo .hd .t:empty::after{content:"\00a0"}
.memo p{margin:0 0 1em;font-size:17.5px}
.memo .sig{font-family:var(--hand);font-size:36px;color:var(--cobalt);margin:.2em 0 0;transform:rotate(-3deg);display:inline-block}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fact{padding:20px 16px;text-align:center;--rt:var(--r,0deg)}
.fact b{display:block;font-family:var(--serif);font-size:clamp(36px,4.5vw,54px);line-height:1;color:var(--cobalt);font-weight:700}
.fact span{display:block;font-size:13px;margin-top:8px;line-height:1.3;color:#2A3A66}

/* experience layout */
.exp{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,56px);align-items:center;margin-bottom:clamp(44px,7vw,96px)}
.exp.flip-lr .obj-col{order:2}
.notes{padding:clamp(20px,3vw,34px)}
.notes .meta{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cobalt);margin:0 0 .4em}
.notes h3{font-size:clamp(24px,3vw,32px);line-height:1.1}
.notes .role{font-style:italic;color:#2A3A66;margin:0 0 .8em}
.notes ul{padding-left:1.1em;margin:0}.notes li{margin:.55em 0}
.notes li::marker{color:var(--coral)}
.obj-col{display:grid;grid-template-columns:minmax(0,1fr);place-items:center}

/* time card */
.timecard{width:min(100%,360px);padding:20px 20px 22px;background-color:#F7F3E6;border-radius:4px;--rt:-1.6deg;background-image:var(--grain),repeating-linear-gradient(180deg,transparent 0 31px,rgba(43,85,201,.16) 31px 32px);color:var(--ink);box-shadow:0 18px 34px -10px rgba(0,0,0,.6)}
.timecard::before{content:"";position:absolute;top:10px;right:14px;width:18px;height:18px;border-radius:50%;background:#0b1633;box-shadow:inset 0 2px 3px rgba(0,0,0,.7)}
.tc-h{border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.tc-h .mono{font-size:11px;letter-spacing:.22em;color:var(--cobalt)}
.tc-h b{display:block;font-family:var(--serif);font-size:30px;line-height:1.05}
.tc-h small{font-family:var(--mono);font-size:12px}
.tc-rows{list-style:none;margin:0;padding:0}
.tc-rows li{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;height:32px;font-family:var(--mono);font-size:13px}
.hole{display:inline-block;width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(11,22,51,.35);position:relative}
.hole::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2B55C9 0 40%,#0B1633 41%);transform:scale(0);transition:transform .45s cubic-bezier(.3,1.8,.5,1);transition-delay:calc(var(--i)*140ms + 300ms + var(--o,0ms))}
.open .hole::after{transform:scale(1)}
.tc-rows .live{color:var(--coral);font-weight:700}
.tc-f{margin-top:10px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.14em;border-top:2px dashed rgba(11,22,51,.4);padding-top:8px}

/* envelope */
.env{width:min(100%,460px)}
.env-art{position:relative;height:290px;perspective:1000px}
.env-back,.env-front,.env-flap{position:absolute;left:0;right:0}
.env-back{top:110px;bottom:0;background:#B9D1F5;border-radius:6px;box-shadow:0 18px 30px -12px rgba(0,0,0,.6)}
.env-letter{position:absolute;left:7%;right:7%;top:128px;bottom:20px;background-color:var(--paper);background-image:var(--grain);border-radius:3px;padding:14px 16px;color:var(--ink);font-family:var(--mono);font-size:12px;transition:transform 1s .35s var(--ease)}
.env-letter b{display:block;font-size:13px;letter-spacing:.1em}
.env-letter i{display:block;height:6px;margin-top:8px;border-radius:3px;background:rgba(43,85,201,.2)}
.open .env-letter{transform:translateY(-92px)}
.env-front{top:110px;bottom:0;background:linear-gradient(180deg,#CFE1FB,#A9C6F2);clip-path:polygon(0 100%,0 34%,50% 66%,100% 34%,100% 100%);border-radius:6px;z-index:2}
.env-flap{top:110px;height:112px;background:linear-gradient(180deg,#A3C0EF,#C6DAF8);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .8s var(--ease);z-index:3}
.open .env-flap{transform:rotateX(180deg);z-index:0}
.env-label{position:absolute;left:0;right:0;bottom:22px;text-align:center;z-index:4;font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--navy);font-weight:700}
.env-sheet{display:grid;grid-template-rows:0fr;transition:grid-template-rows 1s .5s var(--ease)}
.open .env-sheet{grid-template-rows:1fr}
.env-sheet>div{overflow:hidden}
.checks{list-style:none;margin:0;padding:18px 20px 14px;font-size:15px}
.checks li{display:grid;grid-template-columns:24px 1fr;gap:10px;margin:.5em 0;line-height:1.35}
.checks .bx{width:20px;height:20px;border:2px solid var(--ink);border-radius:4px;position:relative;margin-top:1px}
.checks .bx::after{content:"";position:absolute;left:4px;top:-5px;width:7px;height:15px;border:solid var(--coral);border-width:0 4px 4px 0;transform:rotate(40deg) scale(0);transition:transform .35s cubic-bezier(.3,1.7,.5,1);transition-delay:calc(var(--i)*130ms + 1.1s)}
.open .checks .bx::after{transform:rotate(40deg) scale(1)}
.checks-h{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--cobalt);padding:16px 20px 0;margin:0}
.env-toggle{display:block;margin:12px auto 0;background:transparent;border:1px dashed rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:5px 14px;font-size:13px}

/* roster */
.roster{width:min(100%,380px);padding:22px 22px 20px;--rt:1.2deg}
.roster .h{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--cobalt);margin:0 0 4px}
.roster b.t{display:block;font-family:var(--serif);font-size:22px;line-height:1.1;margin-bottom:12px}
.rs-rows{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.rs-rows li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(11,22,51,.18);font-family:var(--mono);font-size:13px}
.ticks{display:flex;gap:6px}
.ticks i{width:20px;height:20px;border:1.5px solid rgba(11,22,51,.4);border-radius:4px;position:relative}
.ticks i::after{content:"";position:absolute;left:5px;top:-1px;width:6px;height:12px;border:solid var(--cobalt);border-width:0 3px 3px 0;transform:rotate(40deg) scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1);transition-delay:calc(var(--i)*90ms + var(--j)*60ms + 250ms)}
.open .ticks i::after{transform:rotate(40deg) scale(1)}
.rs-f{margin-top:10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:#2A3A66}

/* receipt */
.printer{width:min(100%,360px);position:relative}
.slotbar{height:18px;border-radius:9px;background:linear-gradient(180deg,#0f2152,#07102b);box-shadow:0 6px 12px rgba(0,0,0,.45),inset 0 2px 3px rgba(255,255,255,.12);position:relative;z-index:2}
.rc-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows 1.7s .2s linear;margin:-6px 18px 0}
.open .rc-wrap{grid-template-rows:1fr}
.rc-wrap>div{overflow:hidden}
.receipt{background-color:#fff;background-image:var(--grain);color:var(--ink);font-family:var(--mono);font-size:13.5px;padding:30px 20px 34px;position:relative;box-shadow:0 18px 30px -12px rgba(0,0,0,.6);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.receipt .ctr{text-align:center;font-weight:700;letter-spacing:.06em;line-height:1.3}
.receipt .ctr small{display:block;font-weight:400;font-size:11.5px;letter-spacing:.1em}
.receipt hr{border:0;border-top:2px dashed rgba(11,22,51,.45);margin:12px 0}
.rline{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.rline span:last-child{text-align:right;font-weight:700}
.rcf{text-align:center;margin-top:12px;letter-spacing:.2em;font-size:11px}

/* break room */
.board{padding:clamp(22px,4vw,44px);border-radius:14px;background-color:#27407f;background-image:var(--grain),radial-gradient(circle at 20% 15%,rgba(255,255,255,.1),transparent 40%);border:10px solid #0d1f52;box-shadow:inset 0 4px 14px rgba(0,0,0,.45),0 22px 40px -14px rgba(0,0,0,.6)}
.board h3{font-family:var(--serif);color:var(--paper);margin:0 0 .15em;font-size:26px}
.board .sub{margin:0 0 22px;color:var(--sky);font-size:15px}
.hobbies{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,2.4vw,28px)}
.hobby{position:relative;text-align:left;border:0;padding:30px 18px 18px;border-radius:4px;background-color:var(--paper);background-image:var(--grain);color:var(--ink);transform:rotate(var(--r,0deg));transition:transform .4s var(--ease),box-shadow .4s;box-shadow:0 10px 20px -8px rgba(0,0,0,.6)}
.hobby:nth-child(1){--r:-2.4deg}.hobby:nth-child(2){--r:1.8deg}.hobby:nth-child(3){--r:-1.2deg}.hobby:nth-child(4){--r:2.6deg}
.hobby:hover,.hobby:focus-visible{transform:rotate(0) translateY(-8px) scale(1.03);box-shadow:0 22px 30px -10px rgba(0,0,0,.65)}
.hobby::before{content:"";position:absolute;top:8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9d82,#F26B4A 55%,#a53a1f);box-shadow:0 3px 4px rgba(0,0,0,.4)}
.hobby svg{width:46px;height:46px;stroke:var(--cobalt);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;margin-bottom:10px}
.hobby b{display:block;font-family:var(--serif);font-size:20px;line-height:1.1;margin-bottom:6px}
.hobby span{display:block;font-size:13.5px;color:#2A3A66;line-height:1.35}
.hobby em{display:block;margin-top:12px;font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--coral);font-weight:700}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(20px,4vw,48px);margin-top:clamp(28px,4vw,48px)}
.panel{min-width:0;padding:clamp(20px,3vw,30px);border-radius:14px;background:rgba(5,10,28,.45);border:1px solid rgba(191,216,255,.22);backdrop-filter:blur(4px)}
.panel h3{font-family:var(--serif);margin:0 0 .3em;font-size:24px;color:var(--paper)}
.panel .sub{margin:0 0 18px;color:var(--sky);font-size:15px}
.crate{display:flex;gap:0;padding:70px 4px 8px;position:relative;overflow-x:auto;scrollbar-width:thin}
.sleeve{flex:0 0 auto;width:clamp(96px,11vw,120px);aspect-ratio:1;margin-right:-34px;position:relative;isolation:isolate;border:0;padding:10px;border-radius:4px;color:#fff;text-align:left;display:flex;align-items:flex-end;font-family:var(--serif);font-style:italic;font-weight:600;font-size:16px;line-height:1.05;background:none;transition:transform .45s var(--ease)}
.sleeve span{position:relative;z-index:2}
.sleeve::after{content:"";position:absolute;inset:0;border-radius:4px;z-index:1;background:linear-gradient(150deg,var(--a),var(--b));box-shadow:4px 0 8px rgba(0,0,0,.4)}
.sleeve::before{content:"";position:absolute;left:12%;right:12%;top:0;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#c9d6ee 0 8%,#0b1633 9% 14%,#16254f 15% 48%,#0b1633 49%);transform:translateY(0);transition:transform .5s var(--ease);z-index:0}
.sleeve:hover,.sleeve:focus-visible,.sleeve.up{transform:translateY(-14px);z-index:5}
.sleeve:hover::before,.sleeve:focus-visible::before,.sleeve.up::before{transform:translateY(-46px) rotate(120deg)}
.sleeve:last-child{margin-right:0}
.swatches{display:flex;gap:0;margin-top:6px}
.chip{flex:1;min-width:0;height:150px;border-radius:8px 8px 30px 30px;position:relative;margin-right:-8px;transform-origin:50% 100%;transition:transform .5s var(--ease);border:2px solid rgba(255,255,255,.7);box-shadow:2px 0 6px rgba(0,0,0,.3)}
.swatches:hover .chip,.swatches:focus-within .chip{transform:rotate(calc((var(--k) - 2)*5deg)) translateY(-4px)}
.chip span{position:absolute;left:6px;right:6px;bottom:10px;font-family:var(--mono);font-size:11px;font-weight:700;background:rgba(255,255,255,.88);color:var(--ink);border-radius:3px;text-align:center;padding:2px}

.hobby .pic{display:block;height:130px;margin:2px 0 12px;border:5px solid #fff;border-bottom-width:14px;box-shadow:0 2px 6px rgba(0,0,0,.35);overflow:hidden;background:#dfe9fb}
.hobby .pic img{width:100%;height:100%;object-fit:cover;display:block}
.hobby.has-pic>svg{display:none}
/* contact slip */
.contact{padding:clamp(70px,10vw,140px) 0 clamp(50px,7vw,90px)}
.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(24px,5vw,64px);align-items:center}
.contact h2{font-family:var(--serif);font-size:clamp(40px,6.6vw,88px);line-height:.95;margin:0 0 .3em;color:var(--paper);letter-spacing:-.025em;font-weight:600}
.contact h2 em{font-style:italic;font-weight:400;color:var(--sky)}
.links{display:grid;gap:12px;margin-top:22px}
.links a{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:600;padding:14px 18px;border-radius:12px;background:rgba(5,10,28,.45);border:1px solid rgba(191,216,255,.3);transition:transform .3s var(--ease),background .3s;word-break:break-all}
.links a:hover{transform:translateX(6px);background:rgba(43,85,201,.45)}
.links a small{font-family:var(--mono);font-weight:400;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--apricot);min-width:6em}
.slip{background-color:#FFF1D6;background-image:var(--grain);color:var(--ink);padding:26px clamp(18px,3vw,34px) 30px;--rt:1deg;border-radius:4px;border-top:10px solid var(--coral);box-shadow:0 22px 40px -14px rgba(0,0,0,.6)}
.slip h3{font-family:var(--mono)!important;font-weight:700!important;letter-spacing:.14em;font-size:15px!important;color:var(--coral);margin:0 0 14px!important}
.slip label{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-top:14px}
.slip input,.slip select,.slip textarea{width:100%;font:inherit;font-size:17px;border:0;border-bottom:2px solid var(--ink);background:rgba(255,255,255,.5);padding:8px 6px;color:var(--ink);border-radius:2px 2px 0 0}
.slip textarea{min-height:110px;resize:vertical;background-image:repeating-linear-gradient(180deg,transparent 0 27px,rgba(11,22,51,.22) 27px 28px);line-height:28px;font-family:var(--hand);font-size:24px}
.slip .btn{margin-top:20px;cursor:pointer}
.slip .note{font-size:13px;color:#4a4a58;margin:12px 0 0}
footer{border-top:1px solid rgba(191,216,255,.2);padding:26px 0 40px;font-size:14px;color:#BBD0F3;background:rgba(5,10,28,.5)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center}
footer button{background:none;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 14px}

/* pages: projects / skills / map */
.page-head{padding:clamp(48px,8vw,100px) 0 clamp(24px,4vw,50px)}
.page-head p{max-width:54ch;font-size:19px;color:#D3E2FF;margin:1em 0 0}
.case{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(22px,4vw,60px);align-items:center;margin-bottom:clamp(56px,8vw,110px)}
.case.alt .obj-col{order:2}
.stat-row{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px}
.stat{flex:1 1 120px;background:var(--mist);border-radius:10px;padding:14px 14px 12px;border:1px solid rgba(43,85,201,.25)}
.stat b{display:block;font-family:var(--serif);font-size:clamp(30px,3.6vw,42px);line-height:1;color:var(--cobalt)}
.stat span{font-size:13px;color:#2A3A66;display:block;margin-top:6px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.chips li{font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--mist);border:1px solid rgba(43,85,201,.3);color:var(--navy)}
/* pay chart */

.xl{width:min(100%,480px);background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.35),0 8px 12px -6px rgba(0,0,0,.6);color:#222;--rt:-1deg;font-family:var(--mono);font-size:12px}
.xl-title{display:flex;align-items:center;gap:7px;background:#1D6F42;color:#fff;padding:7px 11px}
.xl-title i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45)}.xl-title span{margin-left:8px;font-size:12px}
.xl-rib{display:flex;gap:14px;background:#f3f3f3;padding:6px 12px;border-bottom:1px solid #d4d4d4;font-size:11.5px;color:#444;overflow:hidden;white-space:nowrap}
.xl-rib b{color:#1D6F42;border-bottom:2px solid #1D6F42}
.xl-fx{display:flex;align-items:center;border-bottom:1px solid #d4d4d4;background:#fff;min-width:0}
.xl-name{width:54px;padding:5px 8px;border-right:1px solid #d4d4d4;text-align:center;background:#fafafa}
.xl-fxl{padding:5px 8px;color:#777;font-style:italic;border-right:1px solid #d4d4d4}
.xl-formula{padding:5px 9px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.xl-grid{background:#fff}
.xr{display:grid;grid-template-columns:26px 1.7fr 2.4fr 1.5fr 1.5fr;border-bottom:1px solid #e1e1e1}
.xr>span{padding:6px 7px;border-right:1px solid #e1e1e1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.xr>span:first-child{background:#f3f3f3;color:#777;text-align:center;padding:6px 0}
.xr.xh>span{background:#f3f3f3;color:#777;text-align:center;padding:4px}
.xr.xh2>span{font-weight:700;background:#f7faf8}.xr.xh2>span:first-child{font-weight:400}
.xr>span:nth-child(4),.xr>span:nth-child(5){text-align:right}
.xv{transition:background .3s}
.xr.hot>span:nth-child(5){outline:2px solid #1D6F42;outline-offset:-2px;background:#e7f3ec}
.xr.hot>span:nth-child(5).xf{color:#1D6F42}
.xadj .xb9{outline:2px solid #1D6F42;outline-offset:-2px;font-weight:700;background:#e7f3ec}
.xadj .xnote{grid-column:4/6;text-align:left!important;color:#8a5a14;font-style:italic;opacity:0;transition:opacity .5s}
.xadj .xnote.on{opacity:1}
.xl-tabs{display:flex;gap:12px;align-items:center;padding:6px 11px;background:#f3f3f3;border-top:1px solid #d4d4d4;font-size:11px;color:#666}
.xl-tabs b{background:#fff;padding:3px 10px;border-bottom:2px solid #1D6F42;color:#1D6F42}
@media(max-width:520px){.xl{font-size:10.5px}.xr{grid-template-columns:20px 1.3fr 2.2fr 1.6fr 1.6fr}.xr>span{padding:6px 4px}.xl-rib{gap:10px}}
/* contract */
.book{position:relative;width:min(100%,430px);aspect-ratio:3/4;perspective:1600px}
.pagein,.cover{position:absolute;inset:0;border-radius:4px 10px 10px 4px}
.pagein{background-color:var(--paper);background-image:var(--grain);padding:26px 26px 20px;color:var(--ink);box-shadow:0 24px 40px -12px rgba(0,0,0,.65)}
.pagein h4{font-family:var(--serif);font-size:20px;margin:0 0 .5em;text-align:center}
.pagein ol{margin:0;padding:0;list-style:none;counter-reset:a;font-size:14.5px}
.pagein li{counter-increment:a;display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(11,22,51,.15)}
.pagein li::before{content:"Art. " counter(a);font-family:var(--mono);font-size:12px;color:var(--cobalt);min-width:3.8em;padding-top:2px}
.sigline{position:absolute;left:26px;right:26px;bottom:30px;border-top:2px solid var(--ink);padding-top:4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.sigline .hand{position:absolute;left:8px;top:-34px;font-size:34px;color:var(--cobalt);letter-spacing:0;transform:rotate(-4deg);opacity:0;transition:opacity .6s 1.4s}
.open .sigline .hand{opacity:1}

/* ---------- shared bits ---------- */
function jobNotes(j,extra){
  var meta=[j.org, j.place].filter(Boolean).join(' · ');

function monthRows(start,end){
  var M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var sp=start.split('-').map(Number), now=new Date();

/* ---------- reveal / open / count ---------- */
var io;
function typeInto(el){
  var txt=el.dataset.type; if(RM){el.textContent=txt;return}
  var i=0; (function tick(){ el.textContent=txt.slice(0,++i); if(i<txt.length) setTimeout(tick,34)})();
}
function countUp(el){
  var to=+el.dataset.to, dec=+el.dataset.dec||0, pre=el.dataset.pre||'', suf=el.dataset.suf||'';
  var fmt=function(v){return pre+v.toFixed(dec)+suf};
  if(RM){el.textContent=fmt(to);return}
  var t0=null; (function f(t){ if(!t0)t0=t; var k=Math.min(1,(t-t0)/1300), e=1-Math.pow(1-k,3); el.textContent=fmt(to*e); if(k<1) requestAnimationFrame(f)})(performance.now());
}
function reveal(el){
  if(el.classList.contains('in')) return; el.classList.add('in');
  $$('[data-type]',el).forEach(typeInto);
  $$('[data-to]',el).forEach(countUp);
  if(el.hasAttribute('data-type')) typeInto(el);
  if(el.hasAttribute('data-to')) countUp(el);
}
function observe(root){
  var targets=$$('.rv,.split,[data-open],.stamps',root);
  targets.forEach(function(el){
    if(RM){ if(el.hasAttribute('data-open')) el.classList.add('open'); if(el.hasAttribute('data-xl')) runSheet(el); reveal(el); return; }
    io.observe(el);
  });
}
function initObserver(){
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(!e.isIntersecting) return;
      var el=e.target; reveal(el);
      if(el.hasAttribute('data-open') && !el.dataset.manual){ setTimeout(function(){el.classList.add('open')},el.dataset.d?(+el.dataset.d*140):200); syncTog(el); }
      if(el.hasAttribute('data-xl')) runSheet(el);
      io.unobserve(el);
    });
  },{threshold:.2,rootMargin:'0px 0px -12% 0px'});
}
function syncTog(el){ var b=$('[data-tog]',el); if(b) setTimeout(function(){b.setAttribute('aria-expanded',el.classList.contains('open'))},260); }
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-tog]'); if(!b) return;
  var obj=b.closest('[data-open]'); if(!obj) return;
  obj.dataset.manual='1'; obj.classList.toggle('open'); b.setAttribute('aria-expanded',obj.classList.contains('open'));
});


/* ---------- spreadsheet animatic ---------- */
function runSheet(el){
  if(el._xl) return; el._xl=1;
  var rows=$$('.xr[data-r]',el), fm=$('.xl-formula',el), nm=$('.xl-name',el), note=$('.xnote',el), b9=$('.xb9',el), T=[];
  function fin(){ rows.forEach(function(r){var v=$('.xv',r); v.textContent='$'+v.dataset.v; r.classList.remove('hot')}); nm.textContent='B9'; fm.textContent='6.3%'; note.textContent='3% ahead of CPI-U'; note.classList.add('on'); }
  if(RM){ fin(); return; }
  function at(t,f){T.push(setTimeout(f,t))}
  function cycle(){
    rows.forEach(function(r){$('.xv',r).textContent=''; r.classList.remove('hot'); $('.xv',r).classList.remove('xf')});
    note.classList.remove('on'); nm.textContent='B9'; fm.textContent='6.3%';
    var t=900;
    rows.forEach(function(r,k){
      at(t,function(){ rows.forEach(function(q){q.classList.remove('hot')}); r.classList.add('hot'); nm.textContent='D'+(k+2); fm.textContent='=C'+(k+2)+'*(1+$B$9)'; });
      at(t+450,function(){ var v=$('.xv',r); v.textContent='$'+v.dataset.v; v.classList.add('xf'); });
      t+=800;
    });
    at(t,function(){ rows.forEach(function(q){q.classList.remove('hot')}); nm.textContent='B9'; fm.textContent='6.3%'; note.textContent='3% ahead of CPI-U'; note.classList.add('on'); });
    at(t+4200,cycle);
  }
  cycle();
}

  var raw=location.hash||'#/about'; if(raw.indexOf('#/')!==0) return;

  var name=PAGES.indexOf(seg[1])>-1?seg[1]:'about', anchor=seg[2];
  PAGES.forEach(function(p){ var el=$('#page-'+p); el.hidden=(p!==name) });
  if(!built[name]){ $('#page-'+name).innerHTML={about:pageAbout,projects:pageProjects,'break':pageBreak,skills:pageSkills}[name](); built[name]=true; }
  $$('.tab').forEach(function(t){ if(t.dataset.page===name) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current') });
  document.title=S.name+' — '+TITLES[name];
  observe($('#page-'+name)); observe($('#contact'));
  var go=function(){ var t=anchor&&document.getElementById(anchor); if(t) t.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'}); else window.scrollTo(0,0); sky(); };
  requestAnimationFrame(go);
}
addEventListener('hashchange',route);

/* ---------- go ---------- */
$('#brandName').textContent=S.name; $('#main').tabIndex=-1;
initObserver(); buildContact(); route(); sky();
})();
</script>
